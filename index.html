<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamba Market</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #0b8f45;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
    }

    .pesquisa {
      padding: 15px;
      background: white;
    }

    .pesquisa input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .container {
      padding: 15px;
    }

    .titulo {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .produto {
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .produto .imagem {
      height: 120px;
      background: #e9e9e9;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .produto h3 {
      margin-top: 10px;
      font-size: 17px;
    }

    .preco {
      color: #0b8f45;
      font-weight: bold;
      margin: 7px 0;
    }

    .botao {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 7px;
      background: #0b8f45;
      color: white;
      font-size: 15px;
    }

    footer {
      margin-top: 30px;
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 Kamba Market</h1>
    <p>Compre e venda online em Angola</p>
  </header>

  <div class="pesquisa">
    <input type="text" placeholder="🔎 Procurar produtos...">
  </div>

  <main class="container">

    <h2 class="titulo">Produtos em destaque</h2>

    <div class="produtos">

      <div class="produto">
        <div class="imagem">📱</div>
        <h3>Telemóvel</h3>
        <p class="preco">150.000 Kz</p>
        <button class="botao">Ver produto</button>
      </div>

      <div class="produto">
        <div class="imagem">👟</div>
        <h3>Ténis</h3>
        <p class="preco">25.000 Kz</p>
        <button class="botao">Ver produto</button>
      </div>

      <div class="produto">
        <div class="imagem">👕</div>
        <h3>Roupa</h3>
        <p class="preco">15.000 Kz</p>
        <button class="botao">Ver produto</button>
      </div>

      <div class="produto">
        <div class="imagem">💻</div>
        <h3>Computador</h3>
        <p class="preco">350.000 Kz</p>
        <button class="botao">Ver produto</button>
      </div>

    </div>

  </main>

  <footer>
    <p>© 2026 Kamba Market</p>
    <p>Comprar • Vender • Contactar</p>
  </footer>

</body>
</html>
